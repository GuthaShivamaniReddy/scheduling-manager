name: Package interview

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  package:
    # Prevent recursion: the auto-bump step below pushes a commit back to
    # main, which would otherwise re-trigger this workflow.
    if: ${{ github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        if: github.event_name == 'push'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Auto-bump patch version
        if: github.event_name == 'push'
        run: |
          NEW_VERSION="$(npm version patch --no-git-tag-version)"
          git add package.json
          git commit -m "chore(release): bump to ${NEW_VERSION}"
          git tag "${NEW_VERSION}"
          git push origin HEAD:main
          git push origin "${NEW_VERSION}"

      - name: Read current version
        id: version
        run: echo "value=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Create zip
        run: |
          chmod +x scripts/package-interview.sh
          OUTPUT_DIR="$RUNNER_TEMP" ./scripts/package-interview.sh "${{ steps.version.outputs.value }}"
          echo "ZIP_PATH=$RUNNER_TEMP/vitalize-interview-${{ steps.version.outputs.value }}.zip" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: vitalize-interview-${{ steps.version.outputs.value }}
          path: ${{ env.ZIP_PATH }}
          retention-days: 90
